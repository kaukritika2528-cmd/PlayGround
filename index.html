<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Verdant Quest</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111f;font-family:Georgia,'Times New Roman',serif;color:#fff}#app{height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#263b43,#0b1720 68%,#050c12)}canvas{width:min(100vw,177.7778vh);height:min(56.25vw,100dvh);image-rendering:pixelated;image-rendering:crisp-edges;box-shadow:0 18px 60px #0009}.touch{display:none;position:fixed;z-index:5;bottom:max(18px,env(safe-area-inset-bottom));left:18px;right:18px;justify-content:space-between;pointer-events:none}.dpad,.actions{display:grid;gap:8px;pointer-events:auto}.dpad{grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px}.dpad button:nth-child(1){grid-column:2}.dpad button:nth-child(2){grid-column:1;grid-row:2}.dpad button:nth-child(3){grid-column:2;grid-row:2}.dpad button:nth-child(4){grid-column:3;grid-row:2}.actions{grid-template-columns:58px 58px}.touch button{width:58px;height:58px;border-radius:50%;border:2px solid #ffffffaa;background:#102536cc;color:white;font:700 19px system-ui;box-shadow:0 4px 12px #0008;touch-action:none}.touch button:active{transform:scale(.92)}@media(pointer:coarse),(max-width:900px){.touch{display:flex}}@media(max-width:700px){.touch button{width:52px;height:52px}.dpad{grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px}.actions{grid-template-columns:52px 52px}.touch{bottom:max(8px,env(safe-area-inset-bottom));left:8px;right:8px}}
</style>
</head>
<body><div id="app"><canvas id="game" width="960" height="540"></canvas></div>
<div class="touch"><div class="dpad"><button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><div class="actions"><button data-key="Enter">A</button><button data-key="Escape">B</button></div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
const W=960,H=540,T=32;
let scene='world',keys={},tick=0,toast='',toastT=0,battle=null,battleStep=0,battleMsg='',partyHP=38,partyMax=38,coins=120,healing=false;
let leaguePoints=0,leagueWins=0,leagueRank='BRONZE';
const player={x:8*32+16,y:10*32+16,dir:0,moving:false};
const map=[
'####################','####################','##......##..........','##.###..##.#######.','##.###..##.#######.','##......##.....###.','##.######.###.....','##.######.###.###.','##........###.###.','####.######...###.','####.######.T.###.','####......C.......','####.######.T.###.','##.......###.###.','##.#####.###.###.','##.#####.###.###.','##.#####....######.','##.########.######.','##................','####################'];
const solids=new Set(['#','T','C']);
const creatures=['Mossling','Embercub','Shellbit','Voltfin','Leaflet'];
let wild=null,wildHP=28,wildMax=28;
function rect(a,b,w,h,k){x.fillStyle=k;x.fillRect(a,b,w,h)}
function text(t,a,b,size=20,col='#fff',align='left'){x.font=`bold ${size}px Georgia`;x.textAlign=align;x.fillStyle='#0b1a24';x.fillText(t,a+2,b+2);x.fillStyle=col;x.fillText(t,a,b)}
function ellipse(a,b,w,h,k){x.fillStyle=k;x.beginPath();x.ellipse(a,b,w,h,0,0,Math.PI*2);x.fill()}
function tile(t,col,tree=false){rect(t[0],t[1],32,32,col)}
function drawWorld(){
  // luminous high-detail meadow
  let grass=x.createLinearGradient(0,0,960,540);grass.addColorStop(0,'#79c95c');grass.addColorStop(.55,'#67b94f');grass.addColorStop(1,'#4d9b43');x.fillStyle=grass;x.fillRect(0,0,W,H);
  for(let r=0;r<20;r++)for(let q=0;q<20;q++){let px=q*32,py=r*32,xor=(q*53+r*31)%17;
    if((q+r)%2===0){rect(px,py,32,32,'rgba(255,255,180,.035)')}
    if((q*7+r*11)%19===0){rect(px+8,py+13,2,11,'#91d56b');rect(px+10,py+16,2,8,'#91d56b');rect(px+6,py+20,8,2,'#4f9d45')}
  }
  // sculpted cobblestone road
  for(let r=0;r<20;r++)for(let q=0;q<20;q++){if(r===11&&q>=3&&q<=17||q===6&&r>=2&&r<=16){
    let g=x.createLinearGradient(q*32,r*32,q*32+32,r*32+32);g.addColorStop(0,'#decf9b');g.addColorStop(.5,'#cbb982');g.addColorStop(1,'#bda974');rect(q*32,r*32,32,32,g);
    rect(q*32,r*32+29,32,3,'#9f925e99');rect(q*32+(r%2)*8,r*32+15,14,2,'#eee3bd88');rect(q*32+24,r*32+5,3,9,'#aa9b68');
  }}
  // grand pond with animated reflections
  rect(12*32,2*32,7*32,5*32,'#3f94a4');rect(12*32+4,2*32+4,7*32-8,5*32-8,'#65b9c1');
  for(let q=12;q<19;q++){for(let r=2;r<7;r++){if((q+r+Math.floor(tick/30))%5===0){rect(q*32+5,r*32+9,18,2,'#b8e7deaa')}}}
  rect(13*32+12,3*32+12,5*32-24,2*32-20,'#98d9d0');rect(14*32+4,4*32+8,28,8,'#5eaaa6');
  // beautiful cottage: stone base, timber frame, terracotta roof
  rect(3*32-12,7*32+42,128,76,'#00000028');rect(3*32,8*32,96,64,'#eee1bd');rect(3*32+8,8*32+18,80,46,'#d8c898');
  let roof=x.createLinearGradient(3*32,7*32,6*32,9*32+8);roof.addColorStop(0,'#b94d3e');roof.addColorStop(.55,'#da6a50');roof.addColorStop(1,'#87372f');
  x.fillStyle=roof;x.beginPath();x.moveTo(3*32-10,8*32+12);x.lineTo(4*32+16,7*32-8);x.lineTo(6*32+12,8*32+12);x.lineTo(6*32+12,8*32+22);x.lineTo(3*32-10,8*32+22);x.closePath();x.fill();
  for(let i=0;i<5;i++){rect(3*32+i*19-7,7*32+17+i*8,19,3,'#8e3d32');}rect(3*32+8,8*32+18,7,46,'#704b38');rect(6*32-15,8*32+18,7,46,'#704b38');
  rect(4*32+25,8*32+42,18,29,'#5a3a2b');rect(4*32+28,8*32+45,12,26,'#3e2a22');rect(4*32+32,8*32+55,3,3,'#d9bd72');
  rect(3*32+18,8*32+28,22,20,'#98cbd1');rect(3*32+21,8*32+31,16,14,'#57a4ad');rect(3*32+28,8*32+31,2,14,'#eadfbd');rect(3*32+21,8*32+37,16,2,'#eadfbd');
  rect(5*32+34,7*32+2,18,24,'#7a4938');rect(5*32+38,7*32-4,10,8,'#9b5d49');
  // flower beds
  [[100,304,'#fff1a5'],[112,304,'#f48d96'],[124,304,'#b78fe5'],[136,304,'#fff1a5']].forEach(f=>{rect(f[0],f[1],5,8,f[2]);rect(f[0]+2,f[1]+8,2,6,'#3d8a3d')});
  // detailed trees
  for(let r=0;r<20;r++)for(let q=0;q<20;q++){let ch=map[r][q];if(ch==='T'||(ch==='#'&&q<3&&r>1&&r<18)){let cx=q*32+16,cy=r*32+17;
    rect(cx-8,cy+9,16,12,'#60432d');rect(cx-4,cy+14,8,10,'#503924');
    let c=x.createRadialGradient(cx-5,cy-7,3,cx,cy,24);c.addColorStop(0,'#67bf65');c.addColorStop(.55,'#398a45');c.addColorStop(1,'#236938');x.fillStyle=c;x.beginPath();x.arc(cx,cy,18,0,7);x.fill();
    x.fillStyle='#82cb70';x.beginPath();x.arc(cx-8,cy-8,8,0,7);x.arc(cx+8,cy-5,7,0,7);x.fill();x.fillStyle='#a1da84';x.beginPath();x.arc(cx-9,cy-11,3,0,7);x.arc(cx+5,cy-10,3,0,7);x.fill();
  }}
  // fences around cottage
  for(let q=3;q<7;q++){rect(q*32,9*32+7,5,18,'#8a653e');rect(q*32-3,9*32+8,28,4,'#b79455')}for(let r=8;r<11;r++){rect(7*32+2,r*32+10,5,18,'#8a653e')}
  // sign and ranger
  rect(10*32+10,11*32+17,12,10,'#f1d38a');rect(10*32+14,11*32+24,4,8,'#6b4933');rect(10*32+7,11*32+12,18,8,'#dcbf64');
  rect(7*32+7,8*32+5,18,24,'#efb28f');rect(7*32+4,8*32+20,24,12,'#4f76b3');rect(7*32+7,8*32,18,8,'#57372a');rect(7*32+7,8*32+2,18,3,'#32608d');
  // character shadow and detailed sprite
  rect(player.x-12,player.y+13,24,6,'#17381755');
  rect(player.x-9,player.y-12,18,24,'#e6a48a');rect(player.x-12,player.y-16,24,8,'#ebc54d');rect(player.x-10,player.y-14,20,3,'#fff09a');
  rect(player.x-9,player.y+8,18,12,'#315a99');rect(player.x-6,player.y+10,12,7,'#436eae');rect(player.x-10,player.y+18,7,5,'#4e3427');rect(player.x+3,player.y+18,7,5,'#4e3427');
  if(player.dir===0){rect(player.x-6,player.y-7,4,3,'#1e2933');rect(player.x+2,player.y-7,4,3,'#1e2933')}
  // premium HUD
  x.shadowColor='#0008';x.shadowBlur=12;rect(16,16,220,58,'#102838');x.shadowBlur=0;rect(22,22,208,46,'#fff7d9');text('VERDANT TOWN',34,52,20,'#17334a');
  rect(770,16,174,58,'#102838');rect(776,22,162,46,'#fff7d9');text('● '+coins+'  '+leagueRank,788,52,15,'#17334a');text(leaguePoints+' RP',788,66,11,'#17334a');
  if(toastT>0){rect(250,438,460,64,'#102838ee');rect(258,446,444,48,'#fff7d9');text(toast,480,477,17,'#17334a','center')}
}
function move(){let dx=0,dy=0;if(keys.ArrowLeft)dx=-1;if(keys.ArrowRight)dx=1;if(keys.ArrowUp)dy=-1;if(keys.ArrowDown)dy=1;if(dx&&dy)dy=0;if(!dx&&!dy)return; if(dx<0)player.dir=1;if(dx>0)player.dir=3;if(dy<0)player.dir=0;if(dy>0)player.dir=2;let nx=player.x+dx*2,ny=player.y+dy*2;let tr=Math.floor(ny/T),tc=Math.floor(nx/T);if(tr<0||tr>=20||tc<0||tc>=20||solids.has(map[tr][tc])||map[tr][tc]==='~')return;player.x=nx;player.y=ny;player.moving=true;if(Math.random()<0.012&&((tc>=11&&tc<=18)||(tr>=12&&tr<=17))){startBattle()} }
function interact(){let px=Math.floor(player.x/T),py=Math.floor(player.y/T),dx=[0,0,-1,1][player.dir],dy=[-1,1,0,0][player.dir],tx=px+dx,ty=py+dy;if(tx===7&&ty===8){showToast('MASTER LEAGUE!');setTimeout(()=>startBattle(true),500)}else if(tx>=12&&tx<=18&&ty>=2&&ty<=6){showToast('Fresh pond water sparkles.')}else if(tx===10&&ty===11){showToast('TRAIL: League battles lie in the wild.')}else if(tx===4&&ty>=8&&ty<=10){showToast('Master League arena — enter and battle!');setTimeout(()=>startBattle(true),500)}else{showToast('Nothing to interact with here.')}}
function showToast(s){toast=s;toastT=180}
let leagueBattle=false;
function startBattle(isLeague=false){leagueBattle=isLeague;wild={name:isLeague?'AUREON':creatures[Math.floor(Math.random()*creatures.length)],level:isLeague?18+Math.floor(Math.random()*4):3+Math.floor(Math.random()*3)};wildMax=isLeague?85+wild.level*2:20+wild.level*3;wildHP=wildMax;battleStep=0;battleMsg=isLeague?`MASTER LEAGUE: ${wild.name} challenges you!`:`A wild ${wild.name} appeared!`;scene='battle'}
function drawBattle(){
  // dimensional sky and animated arena
  let sky=x.createLinearGradient(0,0,0,360);sky.addColorStop(0,'#74c7db');sky.addColorStop(.7,'#bfe7cf');sky.addColorStop(1,'#9bd6a3');rect(0,0,W,360,sky);
  rect(0,330,W,210,'#d9c98a');
  for(let i=0;i<7;i++){ellipse(i*170-35,355+(i%2)*18,130,42,i%2?'#78c47a':'#65aa67')}
  ellipse(480,366,400,58,'#b19e65');ellipse(480,354,350,44,'#d8c991');ellipse(480,348,290,34,'#cbb878');
  // clouds drifting through the 3D scene
  let drift=(tick*.12)%1100-100;[drift,drift-420,drift+520].forEach((cx,i)=>{ellipse(cx,75+i*18,55,14,'#eaf8f2cc');ellipse(cx-30,82+i*18,36,11,'#eaf8f2cc');ellipse(cx+32,79+i*18,42,12,'#eaf8f2cc')});
  // depth shadows
  ellipse(710,274,90,24,'#39794955');ellipse(268,404,118,29,'#39794955');
  let bob=Math.round(Math.sin(tick*.06)*5),enemyBob=Math.round(Math.sin(tick*.08+2)*4);
  // enemy creature with rounded 3D shading
  let ec=wild.name==='Mossling'?'#72b96a':wild.name==='Embercub'?'#e88951':wild.name==='Shellbit'?'#67abc1':wild.name==='Voltfin'?'#d7bd54':'#72bd6b';
  ellipse(710,250+enemyBob,82,62,'#4d884f');ellipse(710,218+enemyBob,68,74,ec);ellipse(710,180+enemyBob,48,38,ec);
  ellipse(685,205+enemyBob,12,16,'#e6f0d4');ellipse(735,205+enemyBob,12,16,'#e6f0d4');ellipse(689,205+enemyBob,5,7,'#17232a');ellipse(731,205+enemyBob,5,7,'#17232a');ellipse(710,228+enemyBob,18,8,'#f3c4a0');
  ellipse(668,250+enemyBob,20,38,ec);ellipse(752,250+enemyBob,20,38,ec);
  rect(60,54,330,104,'#16384b');rect(66,60,318,92,'#fff8df');text(wild.name.toUpperCase(),86,92,20,'#18364a');text(`Lv ${wild.level}`,312,92,18,'#18364a','right');drawBar(86,122,wildHP,wildMax,274);
  // hero creature with animated breathing and parallax pose
  ellipse(268,376+bob,76,70,'#397d48');ellipse(268,328+bob,64,72,'#75b96c');ellipse(268,287+bob,48,42,'#75b96c');ellipse(268,270+bob,38,29,'#8bd17d');ellipse(250,292+bob,9,11,'#17252a');ellipse(286,292+bob,9,11,'#17252a');ellipse(268,319+bob,17,9,'#d8d795');ellipse(240,350+bob,18,32,'#62a95c');ellipse(296,350+bob,18,32,'#62a95c');
  rect(568,288,330,118,'#16384b');rect(574,294,318,106,'#fff8df');text('SPROUT',598,326,20,'#18364a');text(leagueBattle?'MASTER':'Lv 5',815,326,18,leagueBattle?'#a66d24':'#18364a','right');drawBar(598,350,partyHP,partyMax,268);
  rect(0,438,W,102,'#16384b');rect(10,448,940,82,'#f8efcf');text(battleMsg,36,494,21,'#18364a');
  if(battleStep===0){drawMenu(['FIGHT','PACK','CUBE','RUN'],2)}
}
function drawBar(a,b,hp,max,w){rect(a,b,w,14,'#27343b');let pw=Math.max(0,w*(hp/max));rect(a+2,b+2,pw-4,10,hp/max>.5?'#54aa54':hp/max>.25?'#dfac43':'#d85d4b')}
function drawMenu(items,cols){let start=610;for(let i=0;i<items.length;i++){let r=Math.floor(i/cols),q=i%cols,px=start+q*160,py=466+r*31;rect(px,py,145,26,i===battleStep%items.length?'#e7c85f':'#d3d0bd');text(items[i],px+72,py+18,14,i===battleStep%items.length?'#fff':'#18364a','center')}}
function battleAction(){if(battleStep===1)return;if(battleStep===0){battleStep=1;battleMsg='Choose a move!';setTimeout(()=>{battleStep=0;battleMsg='1) Leaf Lash  2) Quick Bite  3) Guard';battleMoveMenu=true},300)} }
let battleMoveMenu=false;
function handleBattleKey(k){if(k==='Escape'){if(battleMoveMenu){battleMoveMenu=false;battleStep=0;battleMsg=`What will SPROUT do?`};return}if(k==='Enter'){if(!battleMoveMenu){if(battleStep===0){battleMoveMenu=true;battleMsg='Leaf Lash   |   Quick Bite   |   Guard'}else if(battleStep===1){battleMsg='1) Leaf Lash  2) Quick Bite  3) Guard'};return}attack(0)}if(k==='ArrowRight'||k==='ArrowLeft'||k==='ArrowDown'||k==='ArrowUp'){battleStep=(battleStep+1)%4}}
function attack(){let damage=(leagueBattle?13:7)+Math.floor(Math.random()*(leagueBattle?9:6));wildHP-=damage;if(wildHP<=0){battleMoveMenu=false;if(leagueBattle){leagueWins++;leaguePoints+=35;coins+=100;if(leaguePoints>=100)leagueRank='MASTER';else if(leaguePoints>=60)leagueRank='GOLD';else leagueRank='SILVER';battleMsg=`LEAGUE CHAMPION: ${wild.name} defeated! +35 rank points` }else{coins+=25;battleMsg=`${wild.name} fainted! You won 25 coins.`}setTimeout(()=>{scene='world';partyHP=Math.max(1,partyHP)},leagueBattle?1400:900);return}battleMsg=`Sprout used Leaf Lash! ${damage} damage!`;battleMoveMenu=false;battleStep=0;setTimeout(()=>{if(scene==='battle')enemyTurn()},700)}
function enemyTurn(){let damage=(leagueBattle?10:4)+Math.floor(Math.random()*(leagueBattle?8:5));partyHP-=damage;if(partyHP<=0){battleMsg='Sprout retreated. It is back in town!';setTimeout(()=>{partyHP=partyMax;player.x=8*32+16;player.y=10*32+16;scene='world'},900)}else battleMsg=`${wild.name} struck back for ${damage}!`}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter'].includes(e.key))e.preventDefault();keys[e.key]=true;if(scene==='world'&&(e.key==='Enter'||e.key===' '))interact();if(scene==='battle')handleBattleKey(e.key);});
window.addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;let go=e=>{e.preventDefault();keys[k]=true;if(k==='Enter'||k==='Escape'){if(scene==='world'&&k==='Enter')interact();if(scene==='battle')handleBattleKey(k)}};let stop=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',go);b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop)});
function loop(){tick++;if(scene==='world'){move();drawWorld();if(toastT>0)toastT--}else drawBattle();requestAnimationFrame(loop)}loop();
</script></body></html>
